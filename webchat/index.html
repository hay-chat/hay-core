<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hay.chat Webchat Widget - Development</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- Configuration for development -->
    <script>
      window.HayChat = {
        config: {
          organizationId: "468ccc89-1e15-4916-a3a6-3fb646037110",
          baseUrl: "http://localhost:3001",
          widgetTitle: "Chat with us",
          widgetSubtitle: "Development Mode",
          position: "right",
          theme: "blue",
          showGreeting: true,
          greetingMessage: "👋 Hello! This is the development widget.",
        },
      };
    </script>

    <!-- Dev: the loader with the chat chunk served by Vite (no build, no hash) -->
    <script type="module">
      import { boot } from "/src/loader/boot.ts";
      boot({ position: "right", theme: "blue", ...window.HayChat.config }, () => import("/src/chat.ts"));
    </script>
  </body>
</html>
