name: Publish React Native SDK

# Publishes packages/react-native to npm when a tag like react-native-v0.1.0 is
# pushed. Uses npm trusted publishing (OIDC), so there is no token to store:
# the package's settings on npmjs.com must name this repository and this
# workflow file as a trusted publisher. The very first release is published by
# hand (see packages/react-native/README.md), because the package has to exist
# before a trusted publisher can be added to it.
on:
  push:
    tags: ["react-native-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # trusted publishing needs npm 11.5.1 or newer
          registry-url: "https://registry.npmjs.org"
      - name: Check the tag matches the package version
        run: test "react-native-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: npm ci
      - name: Publish
        run: npm publish --access public
