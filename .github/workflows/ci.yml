name: CI

# staging runs only the webchat job (perf budget); the other jobs gate master.
on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast static checks — no database or services required. These are the cheap,
  # high-signal gates that should pass before any PR merges.
  quality:
    name: Lint & Typecheck
    if: github.ref_name != 'staging' && github.base_ref != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  # Server unit + integration tests (Jest). Postgres (pgvector) and Redis are
  # provisioned as services; integration tests run real queries against them.
  server-tests:
    name: Server Tests
    if: github.ref_name != 'staging' && github.base_ref != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hay
          POSTGRES_PASSWORD: hay_password
          POSTGRES_DB: hay_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hay -d hay_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: hay
      DB_PASSWORD: hay_password
      DB_NAME: hay_db
      DB_SSL: "false"
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ci-test-secret-not-for-production-use-00000
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production-00
      OPENAI_API_KEY: sk-fake-key-for-ci-tests
      NODE_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run database migrations
        run: cd server && npm run migration:run
      - name: Run server tests
        run: npm run test:server

  # Dashboard, shared packages, core plugins and the hay CLI (Vitest). No
  # services needed. Plugin MCP servers are not npm workspaces, so their own
  # lockfiles are installed the way the plugin runtime does it.
  workspace-tests:
    name: Dashboard, Packages & Plugin Tests
    if: github.ref_name != 'staging' && github.base_ref != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install plugin MCP server dependencies
        run: |
          for dir in plugins/core/*/mcp; do
            if [ -f "$dir/package-lock.json" ]; then
              (cd "$dir" && npm ci --omit=dev --no-audit --no-fund)
            fi
          done
      - name: Build shared packages
        run: npm run build:plugin-sdk && npm run build:form-schema
      - name: Run dashboard tests
        run: npm run test:dashboard
      - name: Run package and plugin tests
        run: |
          failed=""
          for dir in packages/* plugins/core/*; do
            if node -e "process.exit(require('./$dir/package.json').scripts?.test ? 0 : 1)" 2>/dev/null; then
              echo "::group::$dir"
              (cd "$dir" && npm test) || failed="$failed $dir"
              echo "::endgroup::"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Tests failed in:$failed"
            exit 1
          fi
      - name: Run hay CLI tests
        run: npm run test:hay-cli

  # Known advisories in production dependencies. Blocking for the webchat
  # widget (clean). Non-blocking for the monorepo until the remaining
  # high-severity advisories, which all need major upgrades, are cleared.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit webchat
        working-directory: webchat
        run: npm audit --omit=dev --audit-level=high
      - name: Audit monorepo (non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Webchat widget: unit tests, then the performance budget on a fresh build
  # (D12-9). The budget fails the job when widget.js grows past 10 KB brotli or
  # the "interaction" loading mode requests anything before the visitor reaches
  # for the button. No Chrome needed; see webchat/scripts/check-perf.mjs.
  webchat:
    name: Webchat Tests & Perf Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webchat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webchat/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run webchat tests
        run: npm test
      - name: Build widget
        run: npm run build
      - name: Check performance budget
        run: npm run check:perf
