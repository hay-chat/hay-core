# Local development services. The fixed project name lets every worktree share
# one stack (the container names below are fixed too).
name: hay-core

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hay-postgres
    restart: unless-stopped
    # Needed by pgvector HNSW index builds: high maintenance_work_mem causes
    # Postgres to allocate dynamic shared-memory segments that exceed Docker's
    # 64 MB default for /dev/shm. Production DO Postgres is unaffected.
    shm_size: 2gb
    environment:
      POSTGRES_USER: hay
      POSTGRES_PASSWORD: hay_password
      POSTGRES_DB: hay_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-create pgvector extension on first run
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hay -d hay_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hay-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: hay-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: hay
      RABBITMQ_DEFAULT_PASS: hay_password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Plugin isolation (off by default). These two run plugin workers away from the
  # server: start them with `docker compose --profile plugin-isolation up -d`
  # and run the server from the hay:local image on the same volumes
  # (plugin-run at /run/hay) with PLUGIN_ISOLATION=strict and
  # PLUGIN_API_SOCKET=/run/hay/api/core.sock. A server started on the host with
  # `npm run dev` can't share unix sockets with Docker Desktop's VM, so local
  # development keeps spawning workers itself. See selfhost/compose.yml.
  plugin-host:
    profiles: [plugin-isolation]
    image: hay:local
    container_name: hay-plugin-host
    command: ["node", "dist/plugin-host/main.js"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Seccomp for bubblewrap's clone/unshare/mount; AppArmor relaxed for this
      # container only, because docker-default denies mount (see selfhost/compose.yml).
      - seccomp=./selfhost/plugin-host-seccomp.json
      - apparmor=unconfined
    mem_limit: 2g
    pids_limit: 512
    cpus: 2
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      PLUGIN_ISOLATION: ${PLUGIN_ISOLATION:-strict}
      PLUGIN_API_SOCKET: /run/hay/api/core.sock
      PLUGIN_EGRESS_SOCKET: /run/hay-egress/pub/proxy.sock
      PLUGIN_EGRESS_CONTROL_SOCKET: /run/hay-egress/ctl/control.sock
    volumes:
      - plugin_run:/run/hay
      - plugin_egress_run:/run/hay-egress
      - custom_plugins:/app/plugins/custom:ro

  plugin-egress:
    profiles: [plugin-isolation]
    image: hay:local
    container_name: hay-plugin-egress
    command: ["node", "dist/plugin-host/egress-main.js"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256
    cpus: 1
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get({socketPath:'/run/hay-egress/ctl/control.sock',path:'/status'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - plugin_egress_run:/run/hay-egress
    networks:
      - plugin_egress

volumes:
  plugin_run:
  plugin_egress_run:
  custom_plugins:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  plugin_egress:
