# Self-hosted Hay: everything on one machine, one domain, automatic HTTPS.
#
#   cd selfhost
#   cp .env.example .env      # then fill in the REQUIRED values
#   docker compose up -d --build
#
# Full guide: ../SELF_HOSTING.md
name: hay

x-hay: &hay
  image: hay:local
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    # The server reads PORT; the dashboard (Nitro) prefers NITRO_PORT.
    PORT: "3001"
    NITRO_PORT: "3000"
    NITRO_HOST: 0.0.0.0
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USERNAME: ${DB_USERNAME:-hay}
    DB_NAME: ${DB_NAME:-hay}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-hay}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
    LOCAL_UPLOAD_PATH: /data/uploads
    # Caddy is the one proxy in front of the server.
    TRUST_PROXY: ${TRUST_PROXY:-1}
    CHROME_REMOTE_URL: http://browser:9223
    API_DOMAIN: ${HAY_DOMAIN:?set HAY_DOMAIN in .env}
    DASHBOARD_DOMAIN: ${HAY_DOMAIN}
    BASE_DOMAIN: ${HAY_DOMAIN}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # pgvector HNSW index builds need more than Docker's 64 MB /dev/shm.
    shm_size: 2gb
    environment:
      POSTGRES_USER: ${DB_USERNAME:-hay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-hay}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hay} -d ${DB_NAME:-hay}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hay}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # One-shot: applies pending database migrations, then exits. The server
  # waits for it, so `docker compose up -d --build` is also the upgrade command.
  migrate:
    <<: *hay
    restart: "no"
    command: ["npx", "typeorm", "migration:run", "-d", "dist/database/data-source.js"]
    depends_on:
      postgres: { condition: service_healthy }

  # One-shot: the app runs unprivileged, so it has to own its uploads volume.
  uploads-perms:
    <<: *hay
    restart: "no"
    user: root
    command: ["chown", "-R", "hay:hay", "/data/uploads"]
    healthcheck:
      disable: true
    volumes:
      - uploads:/data/uploads

  # Renders websites for knowledge-base imports, away from the app and its
  # secrets. On its own network, so it can't reach postgres, redis or rabbitmq.
  browser:
    image: hay-browser:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: browser
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - browser

  server:
    <<: *hay
    command: ["node", "dist/main.js"]
    volumes:
      - uploads:/data/uploads
    networks:
      - default
      - browser
    depends_on:
      uploads-perms: { condition: service_completed_successfully }
      browser: { condition: service_started }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  dashboard:
    <<: *hay
    working_dir: /app/dashboard/.output
    command: ["node", "server/index.mjs"]
    depends_on:
      server: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Reverse proxy with automatic Let's Encrypt certificates. Needs ports 80 and
  # 443 open and HAY_DOMAIN's DNS pointing at this machine.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HAY_DOMAIN: ${HAY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [server, dashboard]

  # Scheduled database and uploads backups. Set RESTIC_REPOSITORY in .env for an
  # encrypted off-site copy. Gets only the variables it needs, not the app's.
  backup:
    image: hay-backup:local
    build:
      context: ./backup
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME:-hay}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-hay}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - backups:/backups
      - uploads:/data/uploads:ro
      - ./.env:/config/hay.env:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "backup.sh", "--check"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 2h

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:

networks:
  browser:
